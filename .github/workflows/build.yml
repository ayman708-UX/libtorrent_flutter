name: Build Native Libraries

on:
  push:
    branches: [main, master, testnewlibtorrent, "temp-build-*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  LIBTORRENT_VERSION: "v2.1.1"
  OPENSSL_TAG: "openssl-3.2.1"
  BOOST_VERSION: "1.84.0"
  BOOST_DIR: "boost_1_84_0"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # LINUX BUILD (static libtorrent, x64 + arm64)
  # ═══════════════════════════════════════════════════════════════════════════════
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-all-dev libssl-dev \
            cmake g++ ninja-build pkg-config \
            libgtk-3-dev xvfb

      - name: Build libtorrent (static, webtorrent=OFF)
        run: |
          git clone --depth 1 --branch $LIBTORRENT_VERSION \
            --recurse-submodules https://github.com/arvidn/libtorrent.git libtorrent-src
          mkdir -p libtorrent-src/build && cd libtorrent-src/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -Ddeprecated-functions=ON \
            -Dencryption=ON \
            -Dwebtorrent=OFF \
            -G Ninja -Wno-dev
          ninja -j$(nproc)
          echo "=== Verifying webtorrent ==="
          grep -E '^webtorrent:BOOL=OFF$' CMakeCache.txt
          echo "✅ libtorrent built successfully"
        timeout-minutes: 40

      - name: Build torrent_bridge (fully self-contained)
        run: |
          LT_LIB=$(find libtorrent-src/build -name "libtorrent-rasterbar.a" | head -1)
          echo "Static lib: $LT_LIB ($(du -h $LT_LIB | cut -f1))"

          # Statically link OpenSSL so the .so does NOT depend on the user
          # having libssl/libcrypto installed on their distro.
          # libssl-dev on Ubuntu ships static .a files alongside the .so.
          MULTIARCH=$(dpkg-architecture -q DEB_HOST_MULTIARCH)
          SSL_A=/usr/lib/${MULTIARCH}/libssl.a
          CRYPTO_A=/usr/lib/${MULTIARCH}/libcrypto.a
          echo "Using static OpenSSL: $SSL_A $CRYPTO_A"
          test -f "$SSL_A" && test -f "$CRYPTO_A"

          mkdir -p build-linux
          g++ -shared -fPIC -O2 -std=c++17 \
            -DTORRENT_BRIDGE_EXPORTS \
            -DTORRENT_USE_OPENSSL \
            -Ilibtorrent-src/include \
            -Ilibtorrent-src/build/include \
            -o build-linux/liblibtorrent_flutter.so \
            src/torrent_bridge.cpp \
            -Wl,--whole-archive "$LT_LIB" -Wl,--no-whole-archive \
            -Wl,-Bstatic -l:libssl.a -l:libcrypto.a -Wl,-Bdynamic \
            -lpthread -ldl

          ls -la build-linux/liblibtorrent_flutter.so
          echo "=== Runtime dependencies ==="
          ldd build-linux/liblibtorrent_flutter.so
          if ldd build-linux/liblibtorrent_flutter.so | grep -E "libssl|libcrypto"; then
            echo "❌ ERROR: .so still depends on libssl/libcrypto at runtime"
            exit 1
          fi
          echo "✅ Linux ${{ matrix.arch }} fully self-contained build succeeded"

      - name: Copy to prebuilt
        run: |
          mkdir -p prebuilt/linux/${{ matrix.arch }}
          cp build-linux/liblibtorrent_flutter.so prebuilt/linux/${{ matrix.arch }}/
          ls -la prebuilt/linux/${{ matrix.arch }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-lib-${{ matrix.arch }}
          path: prebuilt/linux/${{ matrix.arch }}/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════
  # MACOS BUILD (universal2 dylib: arm64 + x86_64)
  # Both slices are cross-compiled on the arm64 runner. Homebrew on Apple
  # Silicon only ships arm64 binaries, so OpenSSL is built from source for
  # both slices and Boost is downloaded as headers-only.
  # ═══════════════════════════════════════════════════════════════════════════════
  build-macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.14"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Download Boost headers
        run: |
          curl -fsSL https://archives.boost.io/release/$BOOST_VERSION/source/$BOOST_DIR.tar.gz -o boost.tar.gz
          tar xf boost.tar.gz
          echo "BOOST_ROOT=$PWD/$BOOST_DIR" >> $GITHUB_ENV

      - name: Cross-compile OpenSSL for macOS arm64 + x86_64
        run: |
          git clone --depth 1 --branch $OPENSSL_TAG https://github.com/openssl/openssl.git openssl-src

          build_openssl() {
            local target="$1"
            local arch="$2"
            local prefix="$PWD/openssl-install-macos-${arch}"
            echo "=== Building OpenSSL: $target ($arch) ==="
            (
              cd openssl-src
              make distclean 2>/dev/null || true
              CC="$(xcrun -sdk macosx -find clang)" \
              CFLAGS="-arch $arch -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -isysroot $(xcrun --sdk macosx --show-sdk-path)" \
              ./Configure $target \
                no-shared no-tests no-ui-console no-docs \
                --prefix="$prefix"
              make -j$(sysctl -n hw.ncpu) build_libs
              make install_dev
            )
          }

          build_openssl "darwin64-arm64-cc" "arm64"
          build_openssl "darwin64-x86_64-cc" "x86_64"

          echo "=== OpenSSL slices ==="
          ls -la openssl-install-macos-arm64/lib/
          ls -la openssl-install-macos-x86_64/lib/
        timeout-minutes: 25

      - name: Build libtorrent + bridge for arm64 and x86_64
        run: |
          set -euo pipefail
          git clone --depth 1 --branch $LIBTORRENT_VERSION \
            --recurse-submodules https://github.com/arvidn/libtorrent.git libtorrent-src

          build_slice() {
            local arch="$1"
            local slice_dir="$PWD/libtorrent-src/build-${arch}"
            local ossl_root="$PWD/openssl-install-macos-${arch}"
            local sdk
            sdk=$(xcrun --sdk macosx --show-sdk-path)
            echo "═══ Building slice: ${arch} ═══"

            mkdir -p "$slice_dir"
            (
              cd "$slice_dir"
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=${arch} \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET} \
                -DCMAKE_OSX_SYSROOT=${sdk} \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DBUILD_SHARED_LIBS=OFF \
                -Ddeprecated-functions=ON \
                -Dencryption=ON \
                -Dwebtorrent=OFF \
                -DOPENSSL_ROOT_DIR="${ossl_root}" \
                -DOPENSSL_INCLUDE_DIR="${ossl_root}/include" \
                -DOPENSSL_CRYPTO_LIBRARY="${ossl_root}/lib/libcrypto.a" \
                -DOPENSSL_SSL_LIBRARY="${ossl_root}/lib/libssl.a" \
                -DOPENSSL_USE_STATIC_LIBS=ON \
                -DBOOST_ROOT="${BOOST_ROOT}" \
                -DBoost_INCLUDE_DIR="${BOOST_ROOT}" \
                -G Ninja -Wno-dev
              ninja -j$(sysctl -n hw.ncpu)
              echo "=== Verifying webtorrent (${arch}) ==="
              grep -E '^webtorrent:BOOL=OFF$' CMakeCache.txt
            )

            local lt_lib
            lt_lib=$(find "${slice_dir}" -name "libtorrent-rasterbar.a" | head -1)
            echo "libtorrent ${arch}: $lt_lib"

            local out_dir="$PWD/build-macos-${arch}"
            mkdir -p "$out_dir"

            clang++ -shared -O2 -std=c++17 \
              -arch ${arch} \
              -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} \
              -isysroot ${sdk} \
              -DTORRENT_BRIDGE_EXPORTS \
              -DTORRENT_USE_OPENSSL \
              -Ilibtorrent-src/include \
              -I${slice_dir}/include \
              -I${BOOST_ROOT} \
              -I${ossl_root}/include \
              -o "${out_dir}/liblibtorrent_flutter.dylib" \
              src/torrent_bridge.cpp \
              -Wl,-force_load,"${lt_lib}" \
              -Wl,-force_load,"${ossl_root}/lib/libssl.a" \
              -Wl,-force_load,"${ossl_root}/lib/libcrypto.a" \
              -framework CoreFoundation -framework SystemConfiguration \
              -install_name @rpath/liblibtorrent_flutter.dylib

            if otool -L "${out_dir}/liblibtorrent_flutter.dylib" | grep -q /opt/homebrew; then
              echo "❌ ERROR: dylib references Homebrew paths"
              otool -L "${out_dir}/liblibtorrent_flutter.dylib"
              exit 1
            fi
            echo "✅ ${arch} dylib built"
          }

          build_slice arm64
          build_slice x86_64
        timeout-minutes: 60

      - name: Lipo arm64 + x86_64 into universal2
        run: |
          mkdir -p build-macos-universal
          lipo -create \
            build-macos-arm64/liblibtorrent_flutter.dylib \
            build-macos-x86_64/liblibtorrent_flutter.dylib \
            -output build-macos-universal/liblibtorrent_flutter.dylib
          echo "=== lipo info ==="
          lipo -info build-macos-universal/liblibtorrent_flutter.dylib
          file build-macos-universal/liblibtorrent_flutter.dylib

      - name: Copy to prebuilt
        run: |
          mkdir -p prebuilt/macos/universal
          cp build-macos-universal/liblibtorrent_flutter.dylib prebuilt/macos/universal/
          cp build-macos-universal/liblibtorrent_flutter.dylib macos/
          ls -la prebuilt/macos/universal/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-lib
          path: prebuilt/macos/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════
  # WINDOWS BUILD (from source — no vcpkg, x64 + arm64)
  # ═══════════════════════════════════════════════════════════════════════════════
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            msvc_arch: x64
            ossl_target: VC-WIN64A
            ossl_no_asm: "no-asm"
          - arch: arm64
            cmake_arch: ARM64
            msvc_arch: x64_arm64
            ossl_target: VC-WIN64-ARM
            ossl_no_asm: "no-asm"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download Boost headers
        shell: pwsh
        run: |
          $uri = "https://archives.boost.io/release/$env:BOOST_VERSION/source/$env:BOOST_DIR.tar.gz"
          Invoke-WebRequest -Uri $uri -OutFile boost.tar.gz
          tar xf boost.tar.gz
          echo "BOOST_ROOT=$env:GITHUB_WORKSPACE\$env:BOOST_DIR" >> $env:GITHUB_ENV

      - name: Build OpenSSL from source
        shell: cmd
        env:
          OSSL_TARGET: ${{ matrix.ossl_target }}
          OSSL_NO_ASM: ${{ matrix.ossl_no_asm }}
        run: |
          git clone --depth 1 --branch %OPENSSL_TAG% https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          perl Configure %OSSL_TARGET% no-shared no-tests no-ui-console no-docs %OSSL_NO_ASM% --prefix="%GITHUB_WORKSPACE%\openssl-install"
          nmake build_libs
          nmake install_dev
        timeout-minutes: 45

      - name: Set OPENSSL_ROOT
        shell: pwsh
        run: |
          echo "OPENSSL_ROOT=$env:GITHUB_WORKSPACE\openssl-install" >> $env:GITHUB_ENV

      - name: Build libtorrent from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:LIBTORRENT_VERSION --recurse-submodules `
            https://github.com/arvidn/libtorrent.git libtorrent-src
          New-Item -ItemType Directory -Force libtorrent-src\build | Out-Null
          Push-Location libtorrent-src\build
          cmake .. -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -Ddeprecated-functions=ON `
            -Dencryption=ON `
            -Dwebtorrent=OFF `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT" `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DBoost_INCLUDE_DIR="$env:BOOST_ROOT" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\libtorrent-install"
          cmake --build . --config Release --target install -j4
          Write-Host "=== Verifying webtorrent ==="
          Select-String "^webtorrent:BOOL=OFF" CMakeCache.txt
          Pop-Location
        timeout-minutes: 120

      - name: Build bridge DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-bridge | Out-Null
          Push-Location build-bridge
          cmake ..\src -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\libtorrent-install" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT" `
            -DBoost_INCLUDE_DIR="$env:BOOST_ROOT" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build . --config Release
          Pop-Location

      - name: Copy to prebuilt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "prebuilt\windows\${{ matrix.arch }}" | Out-Null
          Get-ChildItem -Path build-bridge -Recurse -Filter "libtorrent_flutter.dll" |
            Copy-Item -Destination "prebuilt\windows\${{ matrix.arch }}\"
          Get-ChildItem "prebuilt\windows\${{ matrix.arch }}\"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-lib-${{ matrix.arch }}
          path: prebuilt/windows/${{ matrix.arch }}/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════
  # ANDROID BUILD (static libtorrent, arm64-v8a + armeabi-v7a + x86_64)
  # ═══════════════════════════════════════════════════════════════════════════════
  build-android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Download Boost headers
        run: |
          wget -q https://archives.boost.io/release/$BOOST_VERSION/source/$BOOST_DIR.tar.gz
          tar xf $BOOST_DIR.tar.gz
          echo "BOOST_ROOT=$PWD/$BOOST_DIR" >> $GITHUB_ENV

      - name: Cross-compile OpenSSL for Android
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          case "${{ matrix.abi }}" in
            arm64-v8a)   OSSL_TARGET="android-arm64" ;;
            armeabi-v7a) OSSL_TARGET="android-arm" ;;
            x86_64)      OSSL_TARGET="android-x86_64" ;;
          esac

          git clone --depth 1 --branch $OPENSSL_TAG https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          export ANDROID_NDK_ROOT=$NDK
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          # armeabi-v7a: 32-bit ARM assembly uses relocations that can't be
          # made PIC in a shared library context; use no-asm for 32-bit ARM.
          EXTRA_OPTS=""
          if [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then
            EXTRA_OPTS="no-asm"
          fi

          ./Configure $OSSL_TARGET -D__ANDROID_API__=24 \
            --prefix=$PWD/../openssl-install \
            -fPIC \
            no-shared no-tests no-ui-console no-docs $EXTRA_OPTS
          make -j$(nproc)
          make install_sw
          cd ..
          echo "OPENSSL_ROOT=$PWD/openssl-install" >> $GITHUB_ENV
          echo "=== OpenSSL installed ==="
          ls -la openssl-install/lib*/
        timeout-minutes: 15

      - name: Build libtorrent for Android (webtorrent=ON)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          git clone --depth 1 --branch $LIBTORRENT_VERSION \
            --recurse-submodules https://github.com/arvidn/libtorrent.git libtorrent-src
          cd libtorrent-src

          if [ -d "$OPENSSL_ROOT/lib64" ]; then
            OSSL_LIB_DIR="$OPENSSL_ROOT/lib64"
          else
            OSSL_LIB_DIR="$OPENSSL_ROOT/lib"
          fi

          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK=$NDK \
            -DCMAKE_ANDROID_ARCH_ABI=${{ matrix.abi }} \
            -DCMAKE_ANDROID_STL_TYPE=c++_static \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -Dstatic_runtime=ON \
            -Ddeprecated-functions=ON \
            -Dencryption=ON \
            -Dwebtorrent=OFF \
            -DOPENSSL_ROOT_DIR=$OPENSSL_ROOT \
            -DOPENSSL_INCLUDE_DIR=$OPENSSL_ROOT/include \
            -DOPENSSL_CRYPTO_LIBRARY=$OSSL_LIB_DIR/libcrypto.a \
            -DOPENSSL_SSL_LIBRARY=$OSSL_LIB_DIR/libssl.a \
            -DBOOST_ROOT=$BOOST_ROOT \
            -DBoost_INCLUDE_DIR=$BOOST_ROOT \
            -G Ninja \
            -Wno-dev
          ninja -j$(nproc)
          echo "=== Verifying webtorrent ==="
          grep -E '^webtorrent:BOOL=OFF$' CMakeCache.txt
          echo "✅ Android ${{ matrix.abi }} libtorrent built"
        timeout-minutes: 45

      - name: Build torrent_bridge for Android
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          LT_BUILD_DIR=$PWD/libtorrent-src/build
          LT_SRC_DIR=$PWD/libtorrent-src
          LT_LIB=$(find $LT_BUILD_DIR -name "libtorrent-rasterbar.a" | head -1)
          echo "libtorrent lib: $LT_LIB"

          case "${{ matrix.abi }}" in
            arm64-v8a)   TARGET="aarch64-linux-android24" ;;
            armeabi-v7a) TARGET="armv7a-linux-androideabi24" ;;
            x86_64)      TARGET="x86_64-linux-android24" ;;
          esac

          if [ -d "$OPENSSL_ROOT/lib64" ]; then
            OSSL_LIB_DIR="$OPENSSL_ROOT/lib64"
          else
            OSSL_LIB_DIR="$OPENSSL_ROOT/lib"
          fi

          mkdir -p build-bridge && cd build-bridge

          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ \
            --target=$TARGET \
            -shared -fPIC -O3 -std=c++17 \
            -flto \
            -DTORRENT_BRIDGE_EXPORTS \
            -DTORRENT_USE_OPENSSL \
            -DBOOST_NO_IOSTREAM \
            -I$LT_SRC_DIR/include \
            -I$LT_BUILD_DIR/include \
            -I$BOOST_ROOT \
            -I$OPENSSL_ROOT/include \
            -o liblibtorrent_flutter.so \
            ../src/torrent_bridge.cpp \
            -Wl,--whole-archive $LT_LIB -Wl,--no-whole-archive \
            $OSSL_LIB_DIR/libssl.a $OSSL_LIB_DIR/libcrypto.a \
            -llog \
            -static-libstdc++

          ls -la liblibtorrent_flutter.so
          echo "✅ Built for ${{ matrix.abi }}"

      - name: Copy to prebuilt
        run: |
          mkdir -p prebuilt/android/${{ matrix.abi }}
          cp build-bridge/liblibtorrent_flutter.so prebuilt/android/${{ matrix.abi }}/
          ls -la prebuilt/android/${{ matrix.abi }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-native-lib-${{ matrix.abi }}
          path: prebuilt/android/${{ matrix.abi }}/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════
  # iOS BUILD (device arm64 only — XCFramework)
  # Simulator slices are intentionally omitted; the XCFramework contains only
  # the device arm64 slice, which is sufficient for App Store distribution.
  # ═══════════════════════════════════════════════════════════════════════════════
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install boost cmake ninja

      - name: Cross-compile OpenSSL for iOS arm64 (device)
        run: |
          git clone --depth 1 --branch $OPENSSL_TAG \
            https://github.com/openssl/openssl.git openssl-src

          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          PREFIX="$PWD/openssl-install-ios"
          (
            cd openssl-src
            make distclean 2>/dev/null || true
            CC="$(xcrun -sdk iphoneos -find clang)" \
            CFLAGS="-arch arm64 -isysroot $IOS_SDK -mios-version-min=13.0 -fembed-bitcode" \
            ./Configure ios64-xcrun \
              no-shared no-tests no-ui-console no-docs \
              no-asm \
              --prefix="$PREFIX"
            make -j$(sysctl -n hw.ncpu) build_libs
            make install_dev
          )

          echo "OSSL_IOS_ROOT=$PREFIX" >> $GITHUB_ENV
          echo "=== OpenSSL for iOS device ==="
          ls -la $PREFIX/lib/
        timeout-minutes: 20

      - name: Build libtorrent for iOS arm64 (device, webtorrent=ON)
        run: |
          git clone --depth 1 --branch $LIBTORRENT_VERSION \
            --recurse-submodules https://github.com/arvidn/libtorrent.git libtorrent-src
          cd libtorrent-src && mkdir build-ios && cd build-ios

          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          BOOST_INC=$(brew --prefix boost)/include
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -Ddeprecated-functions=ON \
            -Dencryption=ON \
            -Dwebtorrent=OFF \
            -DOPENSSL_ROOT_DIR="$OSSL_IOS_ROOT" \
            -DOPENSSL_INCLUDE_DIR="$OSSL_IOS_ROOT/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OSSL_IOS_ROOT/lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$OSSL_IOS_ROOT/lib/libssl.a" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DBoost_INCLUDE_DIR=$BOOST_INC \
            -G Ninja -Wno-dev
          ninja -j$(sysctl -n hw.ncpu)
          echo "=== Verifying webtorrent ==="
          grep -E '^webtorrent:BOOL=OFF$' CMakeCache.txt
          echo "=== iOS arm64 static libs ==="
          find . -name "*.a" | head -10
        timeout-minutes: 40

      - name: Build torrent_bridge for iOS arm64 and merge into static library
        run: |
          LT_LIB=$(find libtorrent-src/build-ios -name "libtorrent-rasterbar.a" | head -1)
          BOOST_INC=$(brew --prefix boost)/include
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "libtorrent lib: $LT_LIB"

          mkdir -p build-ios-arm64
          clang++ \
            -target arm64-apple-ios13.0 \
            -c -O3 -std=c++17 \
            -isysroot $IOS_SDK \
            -DTORRENT_BRIDGE_EXPORTS \
            -DTORRENT_USE_OPENSSL \
            -DBOOST_NO_IOSTREAM \
            -Ilibtorrent-src/include \
            -Ilibtorrent-src/build-ios/include \
            -I${BOOST_INC} \
            -I${OSSL_IOS_ROOT}/include \
            -o build-ios-arm64/torrent_bridge.o \
            src/torrent_bridge.cpp

          # Merge bridge object + libtorrent + OpenSSL into one .a
          libtool -static \
            -o build-ios-arm64/liblibtorrent_flutter.a \
            build-ios-arm64/torrent_bridge.o \
            "$LT_LIB" \
            "${OSSL_IOS_ROOT}/lib/libssl.a" \
            "${OSSL_IOS_ROOT}/lib/libcrypto.a"

          ls -la build-ios-arm64/liblibtorrent_flutter.a
          echo "✅ iOS arm64 static build succeeded"

      - name: Create XCFramework (device only)
        run: |
          mkdir -p build-ios-headers
          cp src/torrent_bridge.h build-ios-headers/

          rm -rf prebuilt/ios/libtorrent_flutter.xcframework
          xcodebuild -create-xcframework \
            -library build-ios-arm64/liblibtorrent_flutter.a \
            -headers build-ios-headers/ \
            -output prebuilt/ios/libtorrent_flutter.xcframework

          echo "=== XCFramework contents ==="
          find prebuilt/ios/libtorrent_flutter.xcframework -type f | head -20
          echo "✅ XCFramework created successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-lib
          path: prebuilt/ios/libtorrent_flutter.xcframework/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════
  # RELEASE — create a GitHub Release with zipped native libs
  # Depends directly on all 5 build jobs (no intermediate commit step).
  # ═══════════════════════════════════════════════════════════════════════════════
  create-release:
    needs: [build-linux, build-macos, build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Package release assets
        run: |
          mkdir -p release-assets
          cd release-artifacts

          # Zip each per-platform / per-arch artifact directory.
          # Asset names must match what the platform install scripts request:
          #   Linux:   linux-native-lib-{x64,arm64}.zip      (CMakeLists.txt)
          #   macOS:   macos-native-lib.zip                  (podspec)
          #   Windows: windows-native-lib-{x64,arm64}.zip    (CMakeLists.txt)
          #   Android: android-native-lib-{abi}.zip          (build.gradle)
          #   iOS:     ios-native-lib.zip                    (podspec)
          for dir in \
              linux-native-lib-x64 linux-native-lib-arm64 \
              macos-native-lib \
              windows-native-lib-x64 windows-native-lib-arm64 \
              android-native-lib-arm64-v8a android-native-lib-armeabi-v7a android-native-lib-x86_64 \
              ios-native-lib; do
            if [ -d "$dir" ]; then
              cd "$dir" && zip -r "../../release-assets/${dir}.zip" . && cd ..
            fi
          done

          ls -la ../release-assets/

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Prebuilt native libraries for libtorrent_flutter v${{ steps.version.outputs.version }}

            Built from libtorrent ${{ env.LIBTORRENT_VERSION }} with encryption and deprecated-functions enabled.

            | Platform | Architectures                   |
            |----------|---------------------------------|
            | Linux    | x64, arm64                      |
            | macOS    | universal2 (arm64 + x86_64)     |
            | Windows  | x64, arm64                      |
            | Android  | arm64-v8a, armeabi-v7a, x86_64  |
            | iOS      | arm64 (device)                  |

            All binaries are self-contained — no system dependencies needed.
          files: release-assets/*
          fail_on_unmatched_files: false
          make_latest: true
